<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Now — GlowUp</title>
<link rel="stylesheet" href="GlowUp.css">
</head>
<body>

<header>
  <a href="GlowUp.html" class="logo">✿ GlowUp <span>✦</span></a>
  <nav class="links">
    <ul>
      <li><a href="GlowUp.html">Home</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="reviews.html">Reviews</a></li>
      <li><a href="book.html" class="active">Book Now</a></li>
    </ul>
  </nav>
  <a href="book.html" class="btn">Book Now +</a>
</header>

<div class="page-banner" style="text-align:center;">
  <span class="eyebrow">Let's Book</span>
  <h1>Your <em>Glow</em> ♡</h1>
</div>

<div class="wrap">
  <section style="padding-top:0;">
    <form class="booking-card" onsubmit="alert('Thanks! We will confirm your booking shortly.'); return false;">
      <label class="field">
        WhatsApp contact
        <input type="text" style="border:none;background:rgb(248, 221, 221);text-align:right;">
        </label>
      <label class="field">
        Nail Care 
        <select style="border:none;background:transparent;text-align:right;">
        <option>Manicure</option>
        <option>Pedicure</option>
        <option>N/A</option>
        </select>
      </label>
      <label class="field">
        Select Service
        <select style="border:none;background:transparent;text-align:right;">
          <option>Tips</option>
          <option>Plain Gel</option>
          <option>Builder Gel Overlay</option>
          <option>Polygel Overlay</option>
          <option>Acrylics</option>
          <option>Builder Gel Extensions</option>
          <option>Polygel Extensions</option>
          <option>N/A</option>
        </select>
      </label>
      <label class="field">
        Lash Sets 
        <select style="border:none;background:transparent;text-align:right;">
        <option>Clusters</option>
        <option>Classic Extensions</option>
        <option>Hybrid Extensions</option>
        <option>Volume Extensions</option>
        <option>N/A</option>
        </select>
        </label>
      <label class="field">
        Select Date
        <input type="date" style="border:none;background:transparent;text-align:right;">
      </label>
      <label class="field">
        Select Time
        <input type="time" style="border:none;background:transparent;text-align:right;">
      </label>
      <button type="submit" class="btn">Book Now +</button>
    </form>
  </section>
</div>

<footer>
  <p class="script">self care isn't selfish,</p>
  <h2 style="font-size:1.8rem;">it's necessary.</h2>
  <p>We can't wait to be part of your glow journey.</p>
  <div class="socials">
    <a href="#">IG</a>
    <a href="#">TT</a>
    <a href="#">WA</a>
  </div>
</footer>

</body>
</html>
