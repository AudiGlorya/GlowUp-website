<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Audelles — Admin</title>

  <link rel="stylesheet" href="GlowUp.css">
  <style>
    .admin-wrap {
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .admin-card {
      background: #fff;
      padding: 25px;
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    .login-box {
      max-width: 450px;
      margin: 70px auto;
      padding: 30px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    .login-box input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .booking,
    .admin-review {
      border-top: 1px solid #eee;
      padding: 20px 0;
    }

    .booking:first-child,
    .admin-review:first-child {
      border-top: none;
    }

    .booking strong,
    .admin-review strong {
      display: inline-block;
      min-width: 120px;
    }

    .status {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 20px;
      background: #f5dede;
    }

    .action-btn {
      border: none;
      padding: 9px 15px;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px 5px 0 0;
    }

    .confirm-btn {
      background: #d9efd9;
    }

    .logout-btn {
      background: #222;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    .admin-stars {
      color: #c98a6b;
      font-size: 20px;
      margin-bottom: 8px;
    }

    .review-text {
      color: #5c4f47;
      line-height: 1.6;
      margin: 8px 0;
    }

    .review-name {
      color: #7a6a61;
      font-weight: 600;
    }

    .empty-message {
      color: #7a6a61;
      padding: 20px 0;
    }

    #adminDashboard {
      display: none;
    }

    #loginMessage {
      color: #b00020;
      margin-bottom: 15px;
      word-break: break-word;
    }

    @media (max-width: 700px) {

      .admin-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .admin-wrap {
        margin: 20px auto;
        padding: 15px;
      }

      .admin-card {
        padding: 20px;
      }

      .booking strong,
      .admin-review strong {
        display: block;
        margin-bottom: 3px;
      }

    }
  </style>
</head>

<body>

  <!-- ========================= -->
  <!-- LOGIN SECTION -->
  <!-- ========================= -->

  <div id="loginSection">

    <div class="login-box">

      <h1>GlowUp Admin</h1>

      <p>Sign in to manage your bookings.</p>

      <p id="loginMessage"></p>

      <label>
        Email

        <input
          type="email"
          id="email"
          required
        >
      </label>

      <label>
        Password

        <input
          type="password"
          id="password"
          required
        >
      </label>

      <button
        class="btn"
        id="loginBtn"
      >
        Login
      </button>

    </div>

  </div>


  <!-- ========================= -->
  <!-- ADMIN DASHBOARD -->
  <!-- ========================= -->

  <div id="adminDashboard">

    <div class="admin-wrap">

      <div class="admin-header">

        <div>
          <span class="eyebrow">GlowUp</span>
          <h1>Admin Dashboard</h1>
        </div>

        <button
          class="logout-btn"
          id="logoutBtn"
        >
          Logout
        </button>

      </div>


      <!-- ========================= -->
      <!-- APPOINTMENTS -->
      <!-- ========================= -->

      <div class="admin-card">

        <h2>Appointments</h2>

        <p id="bookingMessage">
          Loading bookings...
        </p>

        <div id="bookingsList"></div>

      </div>


      <!-- ========================= -->
      <!-- REVIEWS -->
      <!-- ========================= -->

      <div class="admin-card">

        <h2>Customer Reviews</h2>

        <p id="reviewMessage">
          Loading reviews...
        </p>

        <div id="reviewsList"></div>

      </div>

    </div>

  </div>
  <script type="module"></script>
</body>
</html>
